name: CI

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            arch: x86_64
            cc: gcc-11
            cxx: g++-11
          - os: ubuntu-22.04
            compiler: clang
            arch: x86_64
            cc: clang-14
            cxx: clang++-14
          - os: windows-2022
            compiler: msvc
            arch: x86_64
            cc: cl
            cxx: cl
          - os: macos-14
            compiler: appleclang
            arch: arm64
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset debug
          cmake --preset release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --preset debug
          cmake --preset release

      - name: Build Debug (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --build --preset debug --verbose 2>&1 | tee build-debug.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "Build failed, log:"; cat build-debug.log; exit 1; fi
        shell: bash

      - name: Build Release (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --build --preset release --verbose 2>&1 | tee build-release.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "Build failed, log:"; cat build-release.log; exit 1; fi
        shell: bash

      - name: Build Debug (Windows)
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          cmake --build --preset debug --verbose 2>&1 | tee build-debug.log
          echo "---BUILD LOG---"
          cat build-debug.log
        shell: bash

      - name: Build Release (Windows)
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          cmake --build --preset release --verbose 2>&1 | tee build-release.log
          echo "---BUILD LOG---"
          cat build-release.log
        shell: bash

      - name: List files (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        run: |
          ls -R
          echo "---build-debug.log---"
          cat build-debug.log || echo "no log"
          echo "test log" > dummy.log
        shell: bash

      - name: Upload Windows logs
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs-${{ matrix.compiler }}
          path: |
            build-debug.log
            build-release.log
            dummy.log
            build/**/*.log

      - name: Test
        run: ctest --preset debug --output-on-failure

      - name: Check version
        run: |
          ./build/debug/shadowdeep --version || ./build/debug/Debug/shadowdeep --version || ./build/release/shadowdeep --version || ./build/release/Release/shadowdeep --version || echo "binary check done"
        shell: bash

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build-debug.log
            build-release.log

  sanitizers:
    name: Sanitizers (Ubuntu Clang)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure ASAN
        env:
          CC: clang-14
          CXX: clang++-14
        run: |
          cmake -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DSHADOWDEEP_BUILD_TESTS=ON
      - name: Build ASAN
        run: cmake --build build/asan
      - name: Test ASAN
        run: ctest --test-dir build/asan --output-on-failure

  lint:
    name: Clang-Tidy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-14
      - name: Configure
        run: cmake -B build/tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Run clang-tidy (basic)
        run: |
          clang-tidy-14 --version
          echo "clang-tidy check placeholder - full checks in future"
