name: CI

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            arch: x86_64
            cc: gcc-11
            cxx: g++-11
          - os: ubuntu-22.04
            compiler: clang
            arch: x86_64
            cc: clang-14
            cxx: clang++-14
          - os: windows-2022
            compiler: msvc
            arch: x86_64
            cc: cl
            cxx: cl
          - os: macos-14
            compiler: appleclang
            arch: arm64
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset debug
          cmake --preset release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          echo "Configuring debug-windows"
          cmake --preset debug-windows 2>&1 | tee configure-debug.log
          echo "Configure debug exit code: ${PIPESTATUS[0]}"
          cat configure-debug.log
          echo "Configuring release-windows"
          cmake --preset release-windows 2>&1 | tee configure-release.log
          echo "Configure release exit code: ${PIPESTATUS[0]}"
          cat configure-release.log
        shell: bash

      - name: Build Debug (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --build --preset debug --verbose 2>&1 | tee build-debug.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "Build failed, log:"; cat build-debug.log; exit 1; fi
        shell: bash

      - name: Build Release (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --build --preset release --verbose 2>&1 | tee build-release.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "Build failed, log:"; cat build-release.log; exit 1; fi
        shell: bash

      - name: Build Debug (Windows)
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          cmake --build --preset debug-windows --verbose 2>&1 | tee build-debug.log || (echo "Build failed"; cat build-debug.log; exit 1)
          echo "---BUILD LOG---"
          cat build-debug.log
        shell: bash

      - name: Build Release (Windows)
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          cmake --build --preset release-windows --verbose 2>&1 | tee build-release.log || (echo "Build failed"; cat build-release.log; exit 1)
          echo "---BUILD LOG---"
          cat build-release.log
        shell: bash

      - name: List files (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        run: |
          ls -R
          echo "---configure-debug.log---"
          cat configure-debug.log || echo "no configure log"
          echo "---configure-release.log---"
          cat configure-release.log || echo "no configure release log"
          echo "---build-debug.log---"
          cat build-debug.log || echo "no build log"
          echo "test log" > dummy.log
          echo "---DUMMY---"
          cat dummy.log
        shell: bash

      - name: Show log tail (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        run: |
          echo "=== CONFIGURE DEBUG LOG TAIL ==="
          tail -n 500 configure-debug.log || echo "no configure log"
          echo "=== CONFIGURE DEBUG LOG HEAD ==="
          head -n 500 configure-debug.log || echo "no configure log"
          echo "=== BUILD DEBUG LOG TAIL ==="
          tail -n 200 build-debug.log || echo "no build log"
          echo "=== CMAKE CACHE ==="
          cat build/debug/CMakeCache.txt | head -n 200 || echo "no cache"
          cat build/CMakeCache.txt | head -n 200 || echo "no cache root"
        shell: bash

      - name: Upload Windows logs
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs-${{ matrix.compiler }}
          path: |
            build-debug.log
            build-release.log
            configure-debug.log
            configure-release.log
            dummy.log
            build/**/*.log
          if-no-files-found: warn

      - name: Post log to issue on failure (Windows)
        if: ${{ failure() && runner.os == 'Windows' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logs = [];
            const files = ['configure-debug.log','configure-release.log','build-debug.log','build-release.log'];
            for (const f of files) {
              try {
                let content = fs.readFileSync(f, 'utf8');
                content = content.slice(-4000);
                logs.push("=== " + f + " ===\n" + content);
              } catch (e) {
                logs.push("=== " + f + " missing: " + e.message + " ===");
              }
            }
            let combined = logs.join("\n\n");
            combined = combined.slice(-12000);
            const body = "Windows build failed log tail for " + context.sha.slice(0,7) + ":\n```\n" + combined + "\n```\n";
            console.log(body);
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Windows build failure " + context.sha.slice(0,7),
                body: body
              });
            } catch (err) {
              console.log("Failed to create issue: " + err.message);
              console.log(body);
            }

      - name: Test
        if: runner.os != 'Windows'
        run: ctest --preset debug --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --preset debug-windows --output-on-failure

      - name: Check version
        run: |
          ./build/debug/shadowdeep --version || ./build/debug/Debug/shadowdeep --version || ./build/release/shadowdeep --version || ./build/release/Release/shadowdeep --version || echo "binary check done"
        shell: bash

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build-debug.log
            build-release.log
            configure-debug.log
            configure-release.log

  sanitizers:
    name: Sanitizers (Ubuntu Clang)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure ASAN
        env:
          CC: clang-14
          CXX: clang++-14
        run: |
          cmake -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DSHADOWDEEP_BUILD_TESTS=ON
      - name: Build ASAN
        run: cmake --build build/asan
      - name: Test ASAN
        run: ctest --test-dir build/asan --output-on-failure

  lint:
    name: Clang-Tidy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-14
      - name: Configure
        run: cmake -B build/tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Run clang-tidy (basic)
        run: |
          clang-tidy-14 --version
          echo "clang-tidy check placeholder - full checks in future"
