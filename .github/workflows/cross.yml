name: Cross Compile

on:
  push:
    branches: [ main, arena/* ]
  workflow_dispatch:

jobs:
  linux-cross:
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, armv7, riscv64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build via Docker
        run: |
          set -e
          case "${{ matrix.target }}" in
            aarch64)
              docker pull dockcross/linux-arm64:latest
              docker run --rm -v $PWD:/work -w /work dockcross/linux-arm64:latest cmake -B build/${{ matrix.target }} -DCMAKE_BUILD_TYPE=Release -DSHADOWDEEP_BUILD_TESTS=OFF
              docker run --rm -v $PWD:/work -w /work dockcross/linux-arm64:latest cmake --build build/${{ matrix.target }} --verbose
              ;;
            armv7)
              docker pull dockcross/linux-armv7:latest
              docker run --rm -v $PWD:/work -w /work dockcross/linux-armv7:latest cmake -B build/${{ matrix.target }} -DCMAKE_BUILD_TYPE=Release -DSHADOWDEEP_BUILD_TESTS=OFF
              docker run --rm -v $PWD:/work -w /work dockcross/linux-armv7:latest cmake --build build/${{ matrix.target }} --verbose
              ;;
            riscv64)
              docker pull dockcross/linux-riscv64:latest
              docker run --rm -v $PWD:/work -w /work dockcross/linux-riscv64:latest cmake -B build/${{ matrix.target }} -DCMAKE_BUILD_TYPE=Release -DSHADOWDEEP_BUILD_TESTS=OFF
              docker run --rm -v $PWD:/work -w /work dockcross/linux-riscv64:latest cmake --build build/${{ matrix.target }} --verbose
              ;;
          esac

  freebsd:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build FreeBSD x86_64
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake ninja
          run: |
            cmake -B build/freebsd -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHADOWDEEP_BUILD_TESTS=OFF
            cmake --build build/freebsd --verbose
