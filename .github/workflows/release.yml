name: Release

on:
  push:
    tags:
      - "Zv1*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., Zv1)"
        required: true
        default: "Zv1"

jobs:
  build-release:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x86_64
            runner: windows-2022
            artifact: shadowdeep-Zv1-windows-x86_64.zip
          - os: windows
            arch: arm64
            runner: windows-2022
            artifact: shadowdeep-Zv1-windows-arm64.zip
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            artifact: shadowdeep-Zv1-linux-x86_64.tar.gz
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04
            artifact: shadowdeep-Zv1-linux-aarch64.tar.gz
          - os: macos
            arch: arm64
            runner: macos-14
            artifact: shadowdeep-Zv1-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure Release
        run: cmake --preset release

      - name: Build Release
        run: cmake --build --preset release --config Release

      - name: Package Windows (x86_64)
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        run: |
          mkdir -p dist/shadowdeep
          cp build/release/shadowdeep.exe dist/shadowdeep/ || cp build/release/Release/shadowdeep.exe dist/shadowdeep/
          cp LICENSE dist/shadowdeep/
          cp README.md dist/shadowdeep/
          cp THIRD_PARTY.md dist/shadowdeep/
          cd dist
          7z a ${{ matrix.artifact }} shadowdeep
        shell: bash

      - name: Package Linux
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist/shadowdeep
          cp build/release/shadowdeep dist/shadowdeep/
          cp LICENSE dist/shadowdeep/
          cp README.md dist/shadowdeep/
          cp THIRD_PARTY.md dist/shadowdeep/
          cd dist
          tar czf ${{ matrix.artifact }} shadowdeep

      - name: Package macOS
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist/shadowdeep
          cp build/release/shadowdeep dist/shadowdeep/
          cp LICENSE dist/shadowdeep/
          cp README.md dist/shadowdeep/
          cp THIRD_PARTY.md dist/shadowdeep/
          cd dist
          tar czf ${{ matrix.artifact }} shadowdeep

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build-release
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
